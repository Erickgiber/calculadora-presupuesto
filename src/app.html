<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta
			name="description"
			content="Calcula el precio justo de tus productos considerando materiales, mano de obra y ganancia."
		/>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Margen" />
		<title>Margen · Calculadora</title>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&display=swap"
		/>
		<script>
			try {
				const stored = JSON.parse(localStorage.getItem('margen-preferencias') || '{}');
				const mode = ['light', 'dark'].includes(stored.tema) ? stored.tema : 'auto';
				const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
				const theme = mode === 'auto' ? (prefersDark ? 'dark' : 'light') : mode;
				document.documentElement.dataset.theme = theme;
				document.documentElement.dataset.design = stored.plantilla || 'clasica';
				document.documentElement.style.colorScheme = theme;
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
