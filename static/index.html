<script>
const $=s=>document.querySelector(s),view=$('#view'),fmt=(n,currency=d.moneda||'USD')=>new Intl.NumberFormat('es-VE',{style:'currency',currency:currency,minimumFractionDigits:2,maximumFractionDigits:2}).format(n),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const currencies={USD:'Dólar estadounidense',VES:'Bolívar venezolano',EUR:'Euro',COP:'Peso colombiano',MXN:'Peso mexicano',ARS:'Peso argentino',CLP:'Peso chileno',PEN:'Sol peruano'};
let preferences={nombre:'',negocio:'',moneda:'USD',tema:'auto',plantilla:'clasica'};try{const stored=JSON.parse(localStorage.getItem('margen-preferencias')||'{}');preferences={nombre:typeof stored.nombre==='string'?stored.nombre:'',negocio:typeof stored.negocio==='string'?stored.negocio:'',moneda:currencies[stored.moneda]?stored.moneda:'USD',tema:['light','dark','auto'].includes(stored.tema)?stored.tema:'auto',plantilla:['clasica','costura','reposteria','arte','minimal','manualidades'].includes(stored.plantilla)?stored.plantilla:stored.plantilla==='botanica'?'arte':'clasica'}}catch{}
const fresh=()=>({moneda:preferences.moneda,producto:'',modoProduccion:'unidad',unidadesLote:'',materiales:'',modoMateriales:'total',totalMateriales:'',itemsMateriales:[{nombre:'',cantidad:'1',precio:''}],horas:'',tarifa:'',gastos:'0',margen:'30'});let d=fresh(),page='inicio',saved=[];try{saved=JSON.parse(localStorage.getItem('margen-calculos')||'[]');if(!Array.isArray(saved))saved=[]}catch{}let selected=null;
const num=v=>Number(String(v).replace(',','.')),round=n=>Math.round((n+Number.EPSILON)*100)/100;
const isBatch=(x=d)=>x.modoProduccion==='lote',batchUnitsValid=(x=d)=>Number.isInteger(num(x.unidadesLote))&&num(x.unidadesLote)>=1,productionUnits=(x=d)=>isBatch(x)&&batchUnitsValid(x)?num(x.unidadesLote):1,byProductionMode=(unitText,batchText)=>isBatch()?batchText:unitText;
const productionModes=[['unidad','Una pieza a la vez','Registras lo que cuesta hacer una sola unidad.'],['lote','Por lote','Produces varias unidades juntas y dividimos los costos entre ellas.']];
function calculate(x=d){const unidades=productionUnits(x),materiales=round(num(x.materiales)/unidades),trabajo=round(num(x.horas)*num(x.tarifa)/unidades),gastos=round(num(x.gastos)/unidades),costo=round(materiales+trabajo+gastos),precio=round(costo/(1-num(x.margen)/100));return{unidades,materiales,trabajo,gastos,costo,precio,ganancia:round(precio-costo)}}
function go(p){closeMenu();page=p;render();window.scrollTo({top:0,behavior:'instant'})}function act(id,fn){const e=document.getElementById(id);if(e)e.addEventListener('click',fn)}
function button(label,id,secondary=false){return `<button class="button ${secondary?'secondary':''}" id="${id}" type="button">${label}</button>`}function heading(step,title,desc){return `<button class="textbutton" type="button" id="back">← Volver</button><div class="eyebrow">PASO ${step} DE 4</div><div class="progress">${[1,2,3,4].map(i=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div><h1>${title}</h1><p>${desc}</p>`}function field(key,label,options={}){return `<label for="${key}">${label}</label><input id="${key}" name="${key}" value="${esc(d[key]??'')}" ${options.disabled?'disabled':''} ${options.text?'type="text" maxlength="60" autocomplete="off"':'type="number" inputmode="'+(options.step===1?'numeric':'decimal')+'" min="'+(options.min??0)+'" max="'+(options.max||100000)+'" step="'+(options.step??0.01)+'"'} required ${options.placeholder?'placeholder="'+options.placeholder+'"':''}><p class="help">${options.help||''}</p>`}
function submit(next,validate){$('#form').addEventListener('submit',e=>{e.preventDefault();const err=validate?.();if(err){$('#error').textContent=err;return}go(next)});view.querySelectorAll('input').forEach(e=>e.addEventListener('input',()=>{if(e.name)d[e.name]=e.value;if(e.name==='materiales')d.totalMateriales=e.value;$('#error').textContent=''}))}
function materialSum(){return round((d.itemsMateriales||[]).reduce((sum,item)=>sum+(Number.isFinite(num(item.precio))&&Number.isFinite(num(item.cantidad??1))?num(item.precio)*num(item.cantidad??1):0),0))}
function materialsValid(){if(d.modoMateriales==='detalle'){const filled=(d.itemsMateriales||[]).filter(item=>item.nombre.trim()||String(item.precio).trim());if(!filled.length)return 'Agrega al menos un producto.';if(filled.some(item=>!item.nombre.trim()||!Number.isFinite(num(item.precio))||num(item.precio)<=0||!Number.isFinite(num(item.cantidad??1))||num(item.cantidad??1)<=0))return 'Completa el nombre, la cantidad y un precio mayor que cero en cada producto.';d.itemsMateriales=filled;d.materiales=String(materialSum())}return !Number.isFinite(num(d.materiales))||num(d.materiales)<=0?'El costo de materiales debe ser mayor que cero.':null}
function materialEnter(e){if(e.key!=='Enter'||e.isComposing)return;e.preventDefault();const input=e.currentTarget,index=Number(input.dataset.item),fields=['nombre','cantidad','precio'],position=fields.indexOf(input.dataset.field);if(position<2){view.querySelector('[data-item="'+index+'"][data-field="'+fields[position+1]+'"]')?.focus();return}const item=d.itemsMateriales[index];if(!item.nombre.trim()||!Number.isFinite(num(item.cantidad??1))||num(item.cantidad??1)<=0||!Number.isFinite(num(item.precio))||num(item.precio)<=0){$('#error').textContent='Completa el nombre, la cantidad y el precio antes de agregar otro producto.';return}if(!input.checkValidity()){input.reportValidity();return}if(index===d.itemsMateriales.length-1){d.itemsMateriales.push({nombre:'',cantidad:'1',precio:''});render()}document.getElementById('item-name-'+(index+1))?.focus()}
function addMaterialTouch(){let index=d.itemsMateriales.findIndex(item=>!item.nombre.trim()||String(item.precio).trim()==='');if(index<0){d.itemsMateriales.push({nombre:'',cantidad:'1',precio:''});index=d.itemsMateriales.length-1;render()}const target=document.getElementById('item-name-'+index);target?.focus();target?.scrollIntoView({block:'center',behavior:'smooth'})}
function wireMaterials(){act('add-material-touch',addMaterialTouch);view.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(d.modoMateriales!=='detalle')d.totalMateriales=d.materiales;d.modoMateriales=b.dataset.mode;if(d.modoMateriales==='detalle'){if(!d.itemsMateriales?.length)d.itemsMateriales=[{nombre:'',cantidad:'1',precio:''}];d.materiales=String(materialSum())}else d.materiales=d.totalMateriales??'';render()});view.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{d.itemsMateriales.splice(Number(b.dataset.remove),1);d.materiales=String(materialSum());render()});view.querySelectorAll('[data-item]').forEach(e=>e.addEventListener('keydown',materialEnter));view.querySelectorAll('[data-item]').forEach(e=>e.addEventListener('input',()=>{d.itemsMateriales[Number(e.dataset.item)][e.dataset.field]=e.value;d.materiales=String(materialSum());$('#materials-sum').textContent=fmt(materialSum());$('#error').textContent=''}))}
const visualTemplates=[{"id":"clasica","nombre":"Margen clásica","descripcion":"Violeta con monedas y billetes de fondo casi visibles.","colors":["#F1EBFB","#BBA6DC"],"light":["#fff","#efe1ff","#352044","#756183","#dfc7ef","#fcf8ff","#7718ba","#F1EBFB","#BBA6DC"],"dark":["#291c39","#3b2550","#f3e6ff","#cbb4df","#573d6c","#1d1429","#d6a8ff","#3c2356","#190f27"]},{"id":"costura","nombre":"Confección","descripcion":"Naranja cálido con botones, hilos y puntadas.","colors":["#FAF0E4","#D6B18D"],"light":["#fffcf8","#fff0df","#492d19","#795c48","#e8c9aa","#fff9f1","#96500c","#FAF0E4","#D6B18D"],"dark":["#302319","#49301e","#fff0df","#d9bda4","#6a482d","#251b13","#ffc47b","#443020","#21160f"]},{"id":"reposteria","nombre":"Repostería","descripcion":"Rosa vibrante con cupcakes y utensilios sutiles.","colors":["#FCEDF6","#DDB5D5"],"light":["#fffbff","#fbe5fc","#49244c","#805c83","#e8c5eb","#fff6ff","#a01da8","#FCEDF6","#DDB5D5"],"dark":["#302035","#49284f","#fce8ff","#d6b5dd","#66416f","#25172a","#f3a5ff","#45264d","#211226"]},{"id":"manualidades","nombre":"Manualidades","descripcion":"Verde con tijeras, pinceles y papel decorativo.","colors":["#EFF4E9","#B4C9AB"],"light":["#fbfff9","#e4efdf","#2b402d","#607561","#c6dac2","#f6fcf3","#3d7240","#EFF4E9","#B4C9AB"],"dark":["#202d23","#2c4032","#e8f5df","#b5cdb0","#44604a","#17211b","#b1dba8","#2c4431","#132019"]},{"id":"arte","nombre":"Arte","descripcion":"Azul intenso con paletas, pinceles y trazos creativos.","colors":["#EEF2FC","#AEC2E3"],"light":["#fcfdff","#e6edff","#263453","#5d6c89","#c7d4f2","#f7f9ff","#1747b8","#EEF2FC","#AEC2E3"],"dark":["#1d2538","#293755","#e7edff","#b7c5e3","#40537a","#151c2c","#a7c1ff","#25385c","#101a30"]},{"id":"minimal","nombre":"Minimal","descripcion":"Gris neutro y una composición limpia, sin dibujos.","colors":["#F4F3F5","#C4C1C9"],"light":["#fff","#ededee","#303033","#6c6b71","#d6d4db","#fafafa","#525057","#F4F3F5","#C4C1C9"],"dark":["#252426","#353338","#f2eff5","#c4c0ca","#514d58","#1c1b1e" const systemTheme=window.matchMedia('(prefers-color-scheme: dark)');function applyTheme(){document.documentElement.dataset.theme=preferences.tema==='auto'?(systemTheme.matches?'dark':'light'):preferences.tema;document.documentElement.style.colorScheme=document.documentElement.dataset.theme;const style=visualTemplates.find(t=>t.id===preferences.plantilla)||visualTemplates[0];document.documentElement.dataset.design=style.id;const colors=style[document.documentElement.dataset.theme];['surface','soft','text','muted','line','input','accent','start','end'].forEach((key,i)=>document.documentElement.style.setProperty('--app-'+key,colors[i]));document.documentElement.style.setProperty('--app-gradient','linear-gradient(180deg,'+colors[7]+' 0%,'+colors[8]+' 100%)');document.documentElement.style.setProperty('--app-button',document.documentElement.dataset.theme==='dark'?colors[1]:colors[6])}systemTheme.addEventListener('change',()=>{if(preferences.tema==='auto')applyTheme()});
function newCalc(){d=fresh();selected=null;go('producto')}
function wireProductionMode(){view.querySelectorAll('input[name=modoProduccion]').forEach(radio=>radio.addEventListener('change',()=>{$('#batch-field').hidden=!isBatch();$('#unidadesLote').disabled=!isBatch()}))}
function render(){let html='';if(['perfil','moneda','historial','ayuda','plantillas','apariencia'].includes(page))html=accountPage();else if(page==='inicio'){const last=saved[0];html=`<div class="eyebrow">HECHO PARA TU EMPRENDIMIENTO</div><h1>Tu próximo precio,<br>con margen.</h1><p>Recupera lo que inviertes, valora tu trabajo y gana lo que mereces.</p><div class="card soft"><h2>Un precio justo empieza aquí</h2><p>Suma tus materiales, tu tiempo y la ganancia que quieres obtener. Nosotros hacemos las cuentas.</p>${button('Calcular precio de venta','start')}${button('Explorar plantillas','browse-templates',true)}</div>${last?`<h2>Retoma donde lo dejaste</h2><div class="card"><div class="eyebrow">TU ÚLTIMO CÁLCULO</div><h2>${esc(last.producto)}</h2><p>Precio de venta sugerido</p><div class="money">${fmt(calculate(last).precio,last.moneda||'USD')}</div><p class="small">Costo: ${fmt(calculate(last).costo,last.moneda||'USD')} · Margen: ${esc(last.margen)} %</p>${button('Ver desglose','last',true)}</div>`:`<div class="card"><h2>Tu primer cálculo te espera</h2><p>Empieza con un producto. Al guardar su cálculo aparecerá aquí.</p></div>`}<h2>Tu tiempo también tiene valor</h2><p>Incluye las horas de trabajo en cada producto. Tu esfuerzo es parte del precio.</p><p class="footer">CRECE A TU RITMO. VENDE CON CONFIANZA.</p>`}
else if(page==='producto')html=`${heading(1,'Cada producto<br>tiene su valor.','Empecemos con lo que vas a vender.')}<form id="form">${field('producto','Nombre del producto',{text:true,placeholder:'Ej. Vela aromática'})}<fieldset class="theme-options"><legend>¿Cómo lo produces?</legend>${productionModes.map(([value,label,desc])=>`<label class="theme-option"><input type="radio" name="modoProduccion" value="${value}" ${(isBatch()?'lote':'unidad')===value?'checked':''}><span><strong>${label}</strong><small>${desc}</small></span></label>`).join('')}</fieldset><div id="batch-field" ${isBatch()?'':'hidden'}>${field('unidadesLote','¿Cuántas unidades produce el lote?',{min:1,step:1,placeholder:'Ej. 12',help:'Dividiremos los costos del lote entre estas unidades.',disabled:!isBatch()})}</div><p class="error" id="error" aria-live="polite"></p><button class="button">Continuar a materiales</button></form>`;
else if(page==='materiales')html=`${heading(2,byProductionMode('¿Cuánto cuesta<br>crear una unidad?','¿Cuánto cuesta<br>producir el lote?'),'Incluye la materia prima y el empaque.')}<div class="eyebrow">${esc(d.producto)}${byProductionMode('',` · Lote de ${productionUnits()} uds.`)}</div><form id="form"><div class="chips material-modes" role="group" aria-label="Cómo ingresar los materiales"><button type="button" data-mode="total" aria-pressed="${d.modoMateriales!=='detalle'}">Ingresar total</button><button type="button" data-mode="detalle" aria-pressed="${d.modoMateriales==='detalle'}">Detallar productos</button></div>${d.modoMateriales==='detalle'?`<p class="help">Agrega el nombre y el costo de cada material o producto que utilizas en ${byProductionMode('una unidad','todo el lote')}.</p><div class="materials-table-card"><div class="table-title"><div><strong>Materiales para ${byProductionMode('una unidad','el lote')}</strong><p>Registra lo que utilizas en ${byProductionMode('una unidad','todo el lote')}.</p></div></div><div class="materials-scroll"><table class="materials-table"><thead><tr><th scope="col">#</th><th scope="col">Producto</th><th scope="col">Cantidad</th><th scope="col">Precio · USD</th><th scope="col"><span class="sr-only">Acciones</span></th></tr></thead><tbody id="material-list">${(d.itemsMateriales||[]).map((item,i)=>`<tr><th scope="row">${i+1}</th><td><input id="item-name-${i}" aria-label="Producto ${i+1}" data-item="${i}" data-field="nombre" enterkeyhint="next" type="text" maxlength="80" value="${esc(item.nombre)}" placeholder="Producto"></td><td><input aria-label="Cantidad del producto ${i+1}" data-item="${i}" data-field="cantidad" enterkeyhint="next" type="number" inputmode="decimal" min="0.001" max="100000" step="any" value="${esc(item.cantidad??1)}" placeholder="1"></td><td><input aria-label="Precio unitario del producto ${i+1} en USD" data-item="${i}" data-field="precio" enterkeyhint="done" type="number" inputmode="decimal" min="0.01" max="100000" step="0.01" value="${esc(item.precio)}" placeholder="0,00"></td><td><button type="button" class="remove-item" data-remove="${i}" aria-label="Eliminar producto ${i+1}">×</button></td></tr>`).join('')}</tbody></table></div><p class="table-help">Cantidad utilizada × precio de compra en la misma unidad.</p><div class="material-add"><button type="button" id="add-material-touch" class="add-inline"><span aria-hidden="true">＋</span> Otro producto</button><span class="add-hint">También puedes usar Enter</span></div></div><div class="row total" aria-live="polite"><span>Total de materiales</span><strong id="materials-sum">${fmt(materialSum())}</strong></div>`:field('materiales','Total gastado en materiales y empaque · USD',{placeholder:'0,00',help:byProductionMode('Ingresa el total correspondiente a una unidad de tu producto.','Ingresa el total que gastas para producir todo el lote.')})}<div class="card"><h2>Cuenta solo lo que usas</h2><p>${byProductionMode('Si una compra alcanza para varias unidades, incluye aquí el costo de la parte que usas en una sola.',`Anota lo que compras para todo el lote; dividiremos el total entre sus ${productionUnits()} unidades.`)} Tu tiempo y los servicios van en los siguientes pasos.</p></div><p class="error" id="error" aria-live="polite"></p><button class="button">Continuar a mi trabajo</button></form>`;
else if(page==='trabajo')html=`${heading(3,'Tu tiempo<br>también cuenta.','Dale un valor a las horas que dedicas.')}<form id="form">${field('horas',byProductionMode('Horas por unidad','Horas para todo el lote'),{max:1000,placeholder:'0,50',help:'30 minutos = 0,50 horas. Puedes ingresar cero.'})}${field('tarifa','Valor de tu hora · USD',{max:10000,placeholder:'4,00'})}<div class="card soft"><h2>Tu esfuerzo es parte del precio</h2><p>Multiplicaremos las horas por el valor de tu hora para incluir tu trabajo${byProductionMode('',` y lo dividiremos entre las ${productionUnits()} unidades del lote`)}.</p></div><p class="error" id="error" aria-live="polite"></p><button class="button">Continuar a mi ganancia</button></form>`;
else if(page==='margen')html=`${heading(4,'Haz espacio<br>para tu ganancia.','Incluye otros gastos y elige tu margen.')}<form id="form">${field('gastos',byProductionMode('Otros gastos por unidad · USD','Otros gastos del lote · USD'),{help:`Luz, transporte, comisiones o alquiler correspondiente a ${byProductionMode('una unidad','todo el lote')}.`})}${field('margen','Margen sobre el precio de venta · %',{max:95,help:'Elige un margen entre 0 y 95 %.'})}<div class="chips">${[20,30,40].map(n=>`<button type="button" data-margin="${n}" aria-pressed="${num(d.margen)===n}">${n} %</button>`).join('')}</div><div class="card soft"><h2>¿Qué significa margen?</h2><p>Con 30 % de margen, de cada $10 que vendes, $3 son ganancia.</p><p class="small">Precio = costo total ÷ (1 − margen / 100).</p></div><p class="error" id="error" aria-live="polite"></p><button class="button">Calcular mi precio</button></form>`;
else if(page==='resultado'){const r=calculate();html=`<button class="textbutton" type="button" id="back">← Editar gastos y ganancia</button><h1>Un precio justo.<br>Una ganancia clara.</h1><p>${byProductionMode('Este es el precio sugerido para una unidad.',`Este es el precio sugerido por unidad de un lote de ${r.unidades} uds.`)}</p><div class="card soft"><h2>${esc(d.producto)}</h2><div class="eyebrow">PRECIO DE VENTA · USD</div><div class="money">${fmt(r.precio)}</div><p class="small">Margen elegido: ${esc(d.margen)} % · Redondeado a centavos</p>${byProductionMode('',`<p class="small">Lote de ${r.unidades} uds.: ${fmt(round(r.precio*r.unidades))}</p>`)}</div><div class="card"><h2>Así se forma tu precio</h2>${[['Materiales y empaque',r.materiales],['Tu trabajo',r.trabajo],['Otros gastos',r.gastos],['Costo total',r.costo],['Tu ganancia por unidad',r.ganancia]].map(([s,v],i)=>`<div class="row ${i===3?'total':''}"><span>${s}</span><strong>${fmt(v)}</strong></div>`).join('')}<p class="small">Tu trabajo: ${esc(d.horas)} h × ${fmt(num(d.tarifa))}/h${byProductionMode('',` ÷ ${r.unidades} uds`)}.</p>${byProductionMode('',`<p class="small">Si vendes las ${r.unidades} unidades del lote, ganas ${fmt(round(r.ganancia*r.unidades))} en total.</p>`)}</div>${button('Guardar cálculo','save')}${button('Editar todos los datos','edit',true)}<p class="help">El precio no incluye impuestos. Si tienes comisiones sobre ventas, inclúyelas en tu análisis.</p>`}
else if(page==='guardado'){html=`<span class="badge">✓ Cálculo guardado</span><h1>Listo para vender<br>con confianza.</h1><p>Tu cálculo se guardó en este navegador.</p><div class="card soft"><h2>${esc(d.producto)}</h2><p>Precio por unidad</p><div class="money">${fmt(calculate().precio)}</div></div>${button('Volver al inicio','tohome')}${button('Calcular otro producto','new',true)}<p class="help">Puedes abrir de nuevo el último desglose desde Inicio.</p>`}
if(['producto','materiales','trabajo','margen','resultado','guardado'].includes(page))html=html.replace(/USD/g,d.moneda||'USD');
view.innerHTML=`<section class="${page==='inicio'?'home-screen':''}">${html}</section>`;wireAccount();act('browse-templates',()=>go('plantillas'));act('start',newCalc);act('new',newCalc);act('tohome',()=>go('inicio'));act('last',()=>{d=structuredClone(saved[0]);selected=d.id;go('resultado')});act('edit',()=>go('producto'));act('back',()=>go(({producto:'inicio',materiales:'producto',trabajo:'materiales',margen:'trabajo',resultado:'margen'})[page]||'inicio'));act('save',()=>{d.producto=d.producto.trim();const entry={...structuredClone(d),moneda:d.moneda||'USD',updatedAt:Date.now(),id:selected||Date.now()};saved=[entry,...saved.filter(x=>x.id!==entry.id)].slice(0,50);try{localStorage.setItem('margen-calculos',JSON.stringify(saved));selected=entry.id;go('guardado')}catch{alert('Este navegador no permite guardar datos locales. El cálculo sigue disponible en esta sesión.')}});
if(page==='producto'){submit('materiales',()=>!d.producto.trim()?'Escribe el nombre de tu producto.':isBatch()&&!batchUnitsValid()?'Indica cuántas unidades produce el lote (mínimo 1).':null);wireProductionMode()}if(page==='materiales'){submit('trabajo',materialsValid);wireMaterials()}if(page==='trabajo')submit('margen',()=>['horas','tarifa'].some(k=>d[k]===''||!Number.isFinite(num(d[k]))||num(d[k])<0)?'Ingresa valores válidos para tu tiempo y tarifa.':null);if(page==='margen'){submit('resultado',()=>!Number.isFinite(num(d.margen))||num(d.margen)<0||num(d.margen)>95?'Elige un margen entre 0 y 95 %.':null);view.querySelectorAll('[data-margin]').forEach(b=>b.onclick=()=>{d.margen=b.dataset.margin;$('#margen').value=d.margen;view.querySelectorAll('[data-margin]').forEach(c=>c.setAttribute('aria-pressed',c===b))});$('#margen').addEventListener('input',()=>view.querySelectorAll('[data-margin]').forEach(b=>b.setAttribute('aria-pressed',num(b.dataset.margin)===num(d.margen))))}}
function persistPreferences(next){try{localStorage.setItem('margen-preferencias',JSON.stringify(next));preferences=next;applyTheme();return true}catch{$('#account-status').textContent='No se pudieron guardar los cambios en este navegador.';return false}}
function deleteSaved(id){const next=id===null?[]:saved.filter(item=>String(item.id)!==String(id));try{localStorage.setItem('margen-calculos',JSON.stringify(next));saved=next;go('historial')}catch{$('#account-status').textContent='No se pudieron borrar los cálculos. Intenta de nuevo.'}}
function accountPage(){const back='<button type="button" class="textbutton" id="tohome">← Inicio</button>';if(page==='plantillas')return `${back}<h1>Elige tu estilo</h1><p>Personaliza los colores y el fondo de toda tu app. Puedes combinar cada diseño con el modo claro u oscuro.</p><div class="template-list">${visualTemplates.map(t=>`<article class="card template-card"><div class="design-preview design-${t.id}" style="--preview-start:${t.colors[0]};--preview-end:${t.colors[1]}"><span class="preview-card"></span><span class="preview-line"></span></div><h2>${esc(t.nombre)}</h2><p>${esc(t.descripcion)}</p><button type="button" class="button secondary" data-template="${t.id}" aria-pressed="${preferences.plantilla===t.id}">${preferences.plantilla===t.id?'✓ Diseño seleccionado':'Aplicar diseño'}</button></article>`).join('')}</div><p id="account-status" class="help" role="status"></p>`;
if(page==='apariencia')return `${back}<h1>A tu manera</h1><p>Elige cómo quieres ver Margen.</p><form id="appearance-form"><fieldset class="theme-options"><legend>Modo de apariencia</legend>${[['light','Claro','Fondos luminosos y violeta suave'],['dark','Oscuro','Superficies oscuras y texto claro'],['auto','Automático','Sigue la apariencia de tu teléfono']].map(([value,label,desc])=>`<label class="theme-option"><input type="radio" name="theme" value="${value}" ${preferences.tema===value?'checked':''}><span><strong>${label}</strong><small>${desc}</small></span></label>`).join('')}</fieldset><p class="help">El cambio se aplica al seleccionarlo y se guarda para tu próxima visita.</p><p id="account-status" class="help" role="status"></p></form>`;
if(page==='perfil')return `${back}<h1>Tu perfil</h1><p>Personaliza tu espacio de trabajo.</p><form id="profile-form"><label for="profile-name">Tu nombre</label><input id="profile-name" autocomplete="given-name" maxlength="60" value="${esc(preferences.nombre)}" placeholder="¿Cómo te llamas?"><label for="profile-business">Nombre de tu emprendimiento</label><input id="profile-business" autocomplete="organization" maxlength="80" value="${esc(preferences.negocio)}" placeholder="Tu emprendimiento"><p class="help">Este perfil se guarda solo en este navegador. No crea una cuenta en línea.</p><button class="button">Guardar perfil</button><p id="account-status" class="help" role="status"></p></form>`;
if(page==='moneda')return `${back}<h1>Tu moneda</h1><p>Elige la moneda para tus próximos cálculos.</p><form id="currency-form"><label for="currency-select">Moneda de trabajo</label><select id="currency-select">${Object.entries(currencies).map(([code,name])=>`<option value="${code}" ${preferences.moneda===code?'selected':''}>${code} · ${name}</option>`).join('')}</select><p class="help">Se aplicará al iniciar un nuevo cálculo. El cálculo actual y los guardados conservan su moneda. No hacemos conversiones de tipo de cambio.</p><button class="button">Guardar moneda</button><p id="account-status" class="help" role="status"></p></form>`;
if(page==='historial')return `${back}<h1>Mis cálculos</h1><p>${saved.length?`${saved.length} cálculo${saved.length===1?'':'s'} guardado${saved.length===1?'':'s'} en este navegador.`:'Aquí aparecerán los cálculos que guardes.'}</p>${saved.map(item=>`<article class="card history-card"><div class="eyebrow">${esc(item.moneda||'USD')} · ${item.updatedAt?new Intl.DateTimeFormat('es',{dateStyle:'medium'}).format(new Date(item.updatedAt)):'Cálculo guardado'}</div><h2>${esc(item.producto)}</h2><div class="history-price">${fmt(calculate(item).precio,item.moneda||'USD')}</div><p class="small">Margen: ${esc(item.margen)} %</p><div class="history-actions"><button type="button" class="button secondary" data-open-saved="${esc(item.id)}">Ver cálculo</button><button type="button" class="delete-button" data-delete-saved="${esc(item.id)}">Borrar</button></div></article>`).join('')}${saved.length?'<button type="button" class="button delete-all" id="delete-all">Borrar todos los cálculos</button>':button('Crear mi primer cálculo','new')}<p id="account-status" class="help" role="status"></p>`;
return `${back}<h1>Ayuda y datos</h1><div class="card"><h2>Todo queda en tu teléfono</h2><p>El perfil, las preferencias y los cálculos se guardan en este navegador. No se sincronizan entre dispositivos y pueden perderse si borras los datos del navegador.</p><h2>¿Cómo calculamos?</h2><p>Costo total = materiales + horas × tarifa + otros gastos.</p><p>Precio = costo total ÷ (1 − margen / 100). Redondeamos a centavos.</p><h2>Monedas</h2><p>Cada cálculo conserva su propia moneda. Cambiar tu preferencia no convierte los importes guardados.</p></div>`}
function wireAccount(){view.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>useTemplate(b.dataset.template));view.querySelectorAll('input[name=theme]').forEach(input=>input.addEventListener('change',()=>{if(persistPreferences({...preferences,tema:input.value}))$('#account-status').textContent='Apariencia guardada.'}));const profile=document.getElementById('profile-form');if(profile)profile.addEventListener('submit',e=>{e.preventDefault();if(persistPreferences({...preferences,nombre:$('#profile-name').value.trim(),negocio:$('#profile-business').value.trim()}))$('#account-status').textContent='Perfil guardado.'});const currency=document.getElementById('currency-form');if(currency)currency.addEventListener('submit',e=>{e.preventDefault();const moneda=$('#currency-select').value;if(currencies[moneda]&&persistPreferences({...preferences,moneda}))$('#account-status').textContent='Moneda guardada. Se usará en tu próximo cálculo.'});view.querySelectorAll('[data-open-saved]').forEach(b=>b.onclick=()=>{const item=saved.find(x=>String(x.id)===b.dataset.openSaved);if(item){d=structuredClone(item);selected=item.id;go('resultado')}});view.querySelectorAll('[data-delete-saved]').forEach(b=>b.onclick=()=>{const item=saved.find(x=>String(x.id)===b.dataset.deleteSaved);if(item&&confirm('¿Borrar el cálculo «'+item.producto+'»? Esta acción no se puede deshacer.'))deleteSaved(item.id)});act('delete-all',()=>{if(confirm('¿Borrar todos tus cálculos guardados? Esta acción no se puede deshacer.'))deleteSaved(null)})}
const menu=document.createElement('dialog');menu.id='app-menu';menu.setAttribute('aria-labelledby','menu-title');document.body.appendChild(menu);const menuButton=$('#home');menuButton.setAttribute('aria-label','Abrir menú de opciones');menuButton.setAttribute('title','Menú');menuButton.setAttribute('aria-haspopup','dialog');menuButton.setAttribute('aria-controls','app-menu');menuButton.setAttribute('aria-expanded','false');function closeMenu(){if(menu.open){menu.close();menuButton.setAttribute('aria-expanded','false')}}function openMenu(){menu.innerHTML=`<div class="menu-top"><div><h2 id="menu-title">${esc(preferences.nombre||'Tu espacio Margen')}</h2><p>${esc(preferences.negocio||'Crece a tu ritmo')}</p></div><button type="button" id="close-menu" aria-label="Cerrar menú">×</button></div><nav class="menu-options" aria-label="Opciones de la aplicación"><button type="button" data-go="inicio">Inicio <span>Tu espacio de trabajo</span></button><button type="button" data-go="plantillas">Plantillas <span>Colores y fondos a tu gusto</span></button><button type="button" data-go="apariencia">Apariencia <span>Modo claro, oscuro o automático</span></button><button type="button" data-go="perfil">Administrar perfil <span>Tu nombre y emprendimiento</span></button><button type="button" data-go="moneda">Cambiar moneda <span>${esc(preferences.moneda)} · ${esc(currencies[preferences.moneda])}</span></button><button type="button" data-go="historial">Mis cálculos <span>Ver, editar o borrar tus cálculos</span></button><button type="button" id="menu-new">Nuevo cálculo <span>Empezar con otro producto</span></button><button type="button" data-go="ayuda">Ayuda y datos <span>Cómo funciona y dónde se guarda</span></button></nav>`;menu.showModal();menuButton.setAttribute('aria-expanded','true');act('close-menu',closeMenu);menu.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));act('menu-new',()=>{closeMenu();newCalc()})}menu.addEventListener('close',()=>menuButton.setAttribute('aria-expanded','false'));menu.addEventListener('click',e=>{if(e.target===menu){const r=menu.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeMenu()}});menuButton.onclick=openMenu;applyTheme();render();
</script></html>
